<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語総まとめ N2 – Tiếng Nhật Mỗi Ngày</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #FAF8F5;
            --bg-card: #FFFFFF;
            --text-primary: #1F2421;
            --text-muted: #6B7280;
            --accent-red: #C84B31;
            --accent-gold: #D4AF37;
            --border-color: #E5E0D8;
            --border-dark: #1F2421;
            --font-display: 'Cinzel', serif;
            --font-serif: 'Newsreader', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.03);
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: var(--font-serif);
            font-size: 18px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Typography & Utilities */
        h1, h2, h3, .brand {
            font-family: var(--font-display);
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .sans {
            font-family: var(--font-sans);
        }

        /* Header / Hero Section */
        header {
            padding: 60px 0 40px;
            border-bottom: 2px solid var(--border-dark);
            margin-bottom: 40px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            font-family: var(--font-sans);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .hero-title {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            line-height: 1.1;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 650px;
            font-style: italic;
        }

        /* Editorial Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 32px;
            margin-bottom: 60px;
            box-shadow: var(--shadow-card);
        }

        .stat-item {
            border-left: 3px solid var(--accent-red);
            padding-left: 16px;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .stat-label {
            font-family: var(--font-sans);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-red);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Main Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .section-title {
            font-size: 1.8rem;
        }

        /* Category Filter Tabs */
        .category-tabs {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .tab-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: var(--text-primary);
            color: var(--bg-card);
            border-color: var(--text-primary);
        }

        /* Course / Category View */
        .category-block {
            margin-bottom: 60px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--text-primary);
            color: var(--bg-card);
            padding: 16px 24px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .category-header h3 {
            font-size: 1.2rem;
            letter-spacing: 0.05em;
        }

        .category-progress-text {
            font-family: var(--font-sans);
            font-size: 14px;
        }

        /* Weeks Grid */
        .weeks-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .week-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 24px;
            box-shadow: var(--shadow-subtle);
        }

        .week-title {
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-red);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .lesson-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-page);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .lesson-item:hover {
            border-color: var(--text-primary);
            background-color: #FFFFFF;
        }

        .lesson-item.completed {
            background-color: #F0F4F1;
            border-color: #A3B899;
        }

        .lesson-item.completed .lesson-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* Custom Checkbox */
        .custom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-primary);
            margin-top: 2px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            background: #FFFFFF;
        }

        .lesson-item.completed .custom-checkbox {
            background: var(--text-primary);
            border-color: var(--text-primary);
        }

        .custom-checkbox::after {
            content: '✓';
            color: #FFFFFF;
            font-size: 12px;
            font-weight: bold;
            display: none;
        }

        .lesson-item.completed .custom-checkbox::after {
            display: block;
        }

        .lesson-content {
            flex-grow: 1;
        }

        .lesson-meta {
            font-family: var(--font-sans);
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .lesson-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
        }

        /* Footer */
        footer {
            margin-top: 80px;
            padding: 40px 0;
            border-top: 2px solid var(--border-dark);
            font-family: var(--font-sans);
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .reset-btn {
            background: none;
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 8px 16px;
            font-family: var(--font-sans);
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background: var(--accent-red);
            color: #FFFFFF;
        }

        @media (max-width: 768px) {
            body { font-size: 16px; padding: 0; }
            .container { padding: 0 16px; }
            header { padding: 30px 0 20px; }
            .hero-title { font-size: 2.2rem; }
            .stats-bar { grid-template-columns: 1fr 1fr; padding: 20px; }
            .lessons-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="top-bar">
            <span class="brand">N2 Study Journal</span>
            <span id="current-date">05 August 2026</span>
        </div>
        <h1 class="hero-title">日本語総まとめ N2</h1>
        <p class="hero-subtitle">Theo dõi tiến độ học Tiếng Nhật N2 theo lộ trình chuẩn 8 tuần. Đơn giản, bền bỉ, mỗi ngày một bước tiến.</p>
    </header>

    <!-- Overall Progress Dashboard -->
    <section class="stats-bar">
        <div class="stat-item">
            <div class="stat-value" id="stat-completed">0 / 219</div>
            <div class="stat-label">Bài học đã xong</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="overall-progress-fill"></div>
            </div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="stat-percent">0%</div>
            <div class="stat-label">Hoàn thành tổng thể</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="stat-streak">0 Ngày</div>
            <div class="stat-label">Chuỗi học liên tục</div>
        </div>
    </section>

    <!-- Filter Tabs -->
    <div class="section-header">
        <h2 class="section-title">Nội dung học tập</h2>
    </div>

    <div class="category-tabs" id="category-tabs">
        <button class="tab-btn active" data-cat="all">Tất cả bài học</button>
        <button class="tab-btn" data-cat="grammar">Ngữ pháp</button>
        <button class="tab-btn" data-cat="vocabulary">Từ vựng</button>
        <button class="tab-btn" data-cat="kanji">Hán tự</button>
        <button class="tab-btn" data-cat="reading">Đọc hiểu</button>
        <button class="tab-btn" data-cat="listening">Nghe hiểu</button>
    </div>

    <!-- Main Dynamic Content -->
    <main id="main-content">
        <!-- Injected via JavaScript -->
    </main>

    <footer>
        <div>N2 Tracker &copy; 2026. Data sourced from VNJPClub.</div>
        <button class="reset-btn" id="reset-btn">Xóa dữ liệu / Đặt lại tiến độ</button>
    </footer>
</div>

<script>
    const STORAGE_KEY = 'n2_study_progress_v1';
    const STREAK_KEY = 'n2_study_streak_v1';

    let lessonsData = null;
    let userProgress = {}; // Stores { "g1d1": true, "k1d2": true, ... }

    // Initialize Application
    document.addEventListener('DOMContentLoaded', async () => {
        loadUserProgress();
        await fetchLessonsData();
        renderDashboard();
        setupEventListeners();
    });

    // Load Cookie/LocalStorage progress
    function loadUserProgress() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                userProgress = JSON.parse(saved);
            } catch (e) {
                userProgress = {};
            }
        }
    }

    // Save progress
    function saveUserProgress() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userProgress));
        updateStreak();
        renderStats();
    }

    // Fetch JSON structure
    async function fetchLessonsData() {
        try {
            const res = await fetch('data/lessons.json');
            lessonsData = await res.json();
        } catch (err) {
            console.error('Lỗi nạp dữ liệu lessons.json:', err);
        }
    }

    // Render Stats
    function renderStats() {
        if (!lessonsData) return;

        let totalLessons = 0;
        let completedCount = 0;

        lessonsData.categories.forEach(cat => {
            cat.weeks.forEach(w => {
                w.lessons.forEach(l => {
                    totalLessons++;
                    if (userProgress[l.id]) completedCount++;
                });
            });
        });

        const percent = totalLessons > 0 ? Math.round((completedCount / totalLessons) * 100) : 0;

        document.getElementById('stat-completed').textContent = `${completedCount} / ${totalLessons}`;
        document.getElementById('stat-percent').textContent = `${percent}%`;
        document.getElementById('overall-progress-fill').style.width = `${percent}%`;

        // Update streak display
        const streakData = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"streak": 0}');
        document.getElementById('stat-streak').textContent = `${streakData.streak} Ngày`;
    }

    // Update daily streak counter
    function updateStreak() {
        const today = new Date().toISOString().split('T')[0];
        let streakData = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"streak": 0, "lastDate": ""}');

        if (streakData.lastDate === today) return;

        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toISOString().split('T')[0];

        if (streakData.lastDate === yesterdayStr) {
            streakData.streak += 1;
        } else if (streakData.lastDate !== today) {
            streakData.streak = 1;
        }

        streakData.lastDate = today;
        localStorage.setItem(STREAK_KEY, JSON.stringify(streakData));
    }

    // Render Main Dashboard & Category Lists
    function renderDashboard(filterCat = 'all') {
        if (!lessonsData) return;

        const main = document.getElementById('main-content');
        main.innerHTML = '';

        lessonsData.categories.forEach(cat => {
            if (filterCat !== 'all' && cat.id !== filterCat) return;

            const catBlock = document.createElement('div');
            catBlock.className = 'category-block';

            // Calculate category level progress
            let catTotal = 0;
            let catDone = 0;
            cat.weeks.forEach(w => {
                w.lessons.forEach(l => {
                    catTotal++;
                    if (userProgress[l.id]) catDone++;
                });
            });

            catBlock.innerHTML = `
                <div class="category-header">
                    <h3>${cat.name} (${cat.nameEn})</h3>
                    <span class="category-progress-text">${catDone}/${catTotal} Hoàn thành</span>
                </div>
                <div class="weeks-container">
                    ${cat.weeks.map(w => `
                        <div class="week-card">
                            <div class="week-title">
                                <span>Tuần ${w.week}</span>
                                <span>${w.lessons.filter(l => userProgress[l.id]).length}/${w.lessons.length}</span>
                            </div>
                            <div class="lessons-grid">
                                ${w.lessons.map(l => `
                                    <div class="lesson-item ${userProgress[l.id] ? 'completed' : ''}" data-id="${l.id}">
                                        <div class="custom-checkbox"></div>
                                        <div class="lesson-content">
                                            <div class="lesson-meta">Ngày ${l.day} • ${l.type === 'practice' ? 'Thực chiến' : 'Bài học'}</div>
                                            <div class="lesson-title">${l.title}</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            main.appendChild(catBlock);
        });

        renderStats();
    }

    // Event Listeners
    function setupEventListeners() {
        // Toggle lesson completion
        document.getElementById('main-content').addEventListener('click', (e) => {
            const item = e.target.closest('.lesson-item');
            if (!item) return;

            const lessonId = item.getAttribute('data-id');
            userProgress[lessonId] = !userProgress[lessonId];

            if (!userProgress[lessonId]) {
                delete userProgress[lessonId];
            }

            item.classList.toggle('completed', !!userProgress[lessonId]);
            saveUserProgress();

            // Refresh progress header text dynamically
            const activeTab = document.querySelector('.tab-btn.active').getAttribute('data-cat');
            renderDashboard(activeTab);
        });

        // Filter tabs
        document.getElementById('category-tabs').addEventListener('click', (e) => {
            if (!e.target.classList.contains('tab-btn')) return;

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            const cat = e.target.getAttribute('data-cat');
            renderDashboard(cat);
        });

        // Reset button
        document.getElementById('reset-btn').addEventListener('click', () => {
            if (confirm('Bạn có chắc chắn muốn đặt lại toàn bộ tiến độ học không?')) {
                userProgress = {};
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(STREAK_KEY);
                renderDashboard();
            }
        });
    }
</script>

</body>
</html>
