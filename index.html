<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本語総まとめ N2 – Học & Theo Dõi Tiến Độ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #FAF8F5;
            --bg-card: #FFFFFF;
            --text-primary: #1F2421;
            --text-muted: #6B7280;
            --accent-red: #C84B31;
            --accent-gold: #D4AF37;
            --border-color: #E5E0D8;
            --border-dark: #1F2421;
            --font-display: 'Cinzel', serif;
            --font-serif: 'Newsreader', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.03);
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: var(--font-serif);
            font-size: 17px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Responsive Top Nav / Header */
        header {
            padding: 40px 0 24px;
            border-bottom: 2px solid var(--border-dark);
            margin-bottom: 30px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 6vw, 3.8rem);
            line-height: 1.15;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Editorial Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 24px;
            margin-bottom: 32px;
            box-shadow: var(--shadow-card);
        }

        .stat-item {
            border-left: 3px solid var(--accent-red);
            padding-left: 12px;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .stat-label {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .progress-bar-container {
            width: 100%;
            height: 5px;
            background-color: var(--border-color);
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-red);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Filter Tabs (Horizontally scrollable on mobile) */
        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 30px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .tab-btn.active {
            background-color: var(--text-primary);
            color: var(--bg-card);
            border-color: var(--text-primary);
        }

        /* Course / Category View */
        .category-block {
            margin-bottom: 48px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--text-primary);
            color: var(--bg-card);
            padding: 14px 20px;
            margin-bottom: 16px;
            font-family: var(--font-sans);
        }

        .category-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .category-progress-text {
            font-size: 13px;
            opacity: 0.85;
        }

        /* Weeks Grid */
        .weeks-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .week-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            box-shadow: var(--shadow-subtle);
        }

        .week-title {
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-red);
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-page);
            transition: all 0.2s ease;
            cursor: pointer;
            border-radius: 4px;
        }

        .lesson-item:active {
            transform: scale(0.99);
        }

        .lesson-item.completed {
            background-color: #F0F4F1;
            border-color: #A3B899;
        }

        .lesson-item.completed .lesson-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* Custom Touch Checkbox */
        .custom-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--text-primary);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .lesson-item.completed .custom-checkbox {
            background: var(--text-primary);
            border-color: var(--text-primary);
        }

        .custom-checkbox::after {
            content: '✓';
            color: #FFFFFF;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }

        .lesson-item.completed .custom-checkbox::after {
            display: block;
        }

        .lesson-content {
            flex-grow: 1;
            min-width: 0;
        }

        .lesson-meta {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .lesson-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .study-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent-red);
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* Study Modal / Inline Reader */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(31, 36, 33, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-dark);
            width: 100%;
            max-width: 650px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border-radius: 8px;
            overflow: hidden;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-page);
        }

        .modal-header h3 {
            font-family: var(--font-sans);
            font-size: 16px;
            color: var(--accent-red);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
            line-height: 1;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex-grow: 1;
            font-size: 16px;
        }

        .modal-body h4 {
            font-family: var(--font-sans);
            font-size: 20px;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .grammar-point {
            border-left: 3px solid var(--accent-gold);
            padding-left: 16px;
            margin-bottom: 20px;
        }

        .grammar-title {
            font-weight: bold;
            font-size: 18px;
            color: var(--accent-red);
        }

        .grammar-meaning {
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .example-box {
            background: var(--bg-page);
            padding: 12px 16px;
            margin-top: 8px;
            font-size: 15px;
            border-radius: 4px;
        }

        .jp-sentence {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .vi-sentence {
            color: var(--text-muted);
            font-size: 14px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-page);
        }

        .complete-modal-btn {
            background: var(--accent-red);
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
        }

        /* Mobile specific optimizations */
        @media (max-width: 600px) {
            .container { padding: 0 12px; }
            .stats-bar { grid-template-columns: 1fr; gap: 12px; padding: 16px; }
            .hero-title { font-size: 2rem; }
            .lessons-grid { grid-template-columns: 1fr; }
            .modal-card { max-height: 92vh; margin: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="top-bar">
            <span>N2 Study Journal</span>
            <span id="current-date">05 AUGUST 2026</span>
        </div>
        <h1 class="hero-title">日本語総まとめ N2</h1>
        <p class="hero-subtitle">Học & Theo dõi tiến độ chuẩn 8 tuần. Đơn giản, trực quan trên iPhone & Desktop.</p>
    </header>

    <!-- Overall Progress Stats -->
    <section class="stats-bar">
        <div class="stat-item">
            <div class="stat-value" id="stat-completed">0 / 219</div>
            <div class="stat-label">Bài học xong</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="overall-progress-fill"></div>
            </div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="stat-percent">0%</div>
            <div class="stat-label">Hoàn thành</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="stat-streak">0 Ngày</div>
            <div class="stat-label">Chuỗi học</div>
        </div>
    </section>

    <!-- Filter Category Tabs -->
    <div class="category-tabs" id="category-tabs">
        <button class="tab-btn active" data-cat="all">Tất cả</button>
        <button class="tab-btn" data-cat="grammar">Ngữ pháp</button>
        <button class="tab-btn" data-cat="vocabulary">Từ vựng</button>
        <button class="tab-btn" data-cat="kanji">Hán tự</button>
        <button class="tab-btn" data-cat="reading">Đọc hiểu</button>
        <button class="tab-btn" data-cat="listening">Nghe hiểu</button>
    </div>

    <!-- Main List View -->
    <main id="main-content"></main>
</div>

<!-- Inline Study Modal -->
<div class="modal-overlay" id="study-modal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modal-category">NGỮ PHÁP</h3>
            <button class="modal-close" id="modal-close">&times;</button>
        </div>
        <div class="modal-body" id="modal-body">
            <!-- Dynamic study content -->
        </div>
        <div class="modal-footer">
            <span id="modal-lesson-id" style="font-family: var(--font-sans); font-size: 12px; color: var(--text-muted);"></span>
            <button class="complete-modal-btn" id="modal-toggle-complete">Đánh dấu đã học</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'n2_study_progress_v1';
    const STREAK_KEY = 'n2_study_streak_v1';

    let lessonsData = null;
    let userProgress = {};
    let currentActiveLessonId = null;

    // Rich Sample Content Generator for Inline Study Mode
    const sampleContent = {
        grammar: {
            meaning: "Ý nghĩa: Có cảm giác như là... / Có vẻ... (Diễn tả tình trạng, cảm giác không rõ ràng hoàn toàn)",
            explanation: "Dùng khi muốn nói đến một trạng thái thể chất hoặc tinh thần mang tính cảm giác.",
            examples: [
                { jp: "風邪気味で熱っぽい。", vi: "Tôi cảm thấy hơi sốt vì hình như bị cảm." },
                { jp: "最近ちょっと疲れ気味だ。", vi: "Dạo này tôi hơi có cảm giác mệt mỏi." }
            ]
        },
        vocab: {
            meaning: "Chủ đề từ vựng sinh hoạt & đời sống hàng ngày",
            explanation: "Các từ vựng cốt lõi thường xuất hiện trong đề thi N2 phần Từ vựng.",
            examples: [
                { jp: "アパートを探す。", vi: "Tìm kiếm căn hộ." },
                { jp: "引っ越しは大変だ。", vi: "Chuyển nhà thật là vất vả." }
            ]
        },
        kanji: {
            meaning: "Hán tự ứng dụng trong bảng hiệu & thông báo",
            explanation: "Học cách đọc Âm Hán & Âm Nhật của các chữ Hán N2.",
            examples: [
                { jp: "立札（たてふだ）", vi: "Biển báo, bảng thông báo đứng." },
                { jp: "注意書き（ちゅういがき）", vi: "Bản ghi chú chú ý." }
            ]
        },
        reading: {
            meaning: "Đọc hiểu dạng bài ngắn & trung văn",
            explanation: "Phân tích từ khóa và cấu trúc câu để nắm bắt ý chính.",
            examples: [
                { jp: "割引券（わりびきけん）を使う。", vi: "Sử dụng phiếu giảm giá." }
            ]
        },
        listening: {
            meaning: "Luyện nghe hiểu hội thoại & nghe phát âm",
            explanation: "Tập trung phân tích âm điệu, nối âm và ngữ cảnh hội thoại.",
            examples: [
                { jp: "発音の聞き取り練習。", vi: "Luyện nghe nhận biết phát âm." }
            ]
        }
    };

    document.addEventListener('DOMContentLoaded', async () => {
        loadUserProgress();
        await fetchLessonsData();
        renderDashboard();
        setupEventListeners();
    });

    function loadUserProgress() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try { userProgress = JSON.parse(saved); } catch (e) { userProgress = {}; }
        }
    }

    function saveUserProgress() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userProgress));
        updateStreak();
        renderStats();
    }

    async function fetchLessonsData() {
        try {
            const res = await fetch('data/lessons.json');
            lessonsData = await res.json();
        } catch (err) {
            console.error('Lỗi nạp lessons.json:', err);
        }
    }

    function renderStats() {
        if (!lessonsData) return;
        let total = 0, done = 0;
        lessonsData.categories.forEach(cat => {
            cat.weeks.forEach(w => {
                w.lessons.forEach(l => {
                    total++;
                    if (userProgress[l.id]) done++;
                });
            });
        });

        const percent = total > 0 ? Math.round((done / total) * 100) : 0;
        document.getElementById('stat-completed').textContent = `${done} / ${total}`;
        document.getElementById('stat-percent').textContent = `${percent}%`;
        document.getElementById('overall-progress-fill').style.width = `${percent}%`;

        const streakData = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"streak": 0}');
        document.getElementById('stat-streak').textContent = `${streakData.streak} Ngày`;
    }

    function updateStreak() {
        const today = new Date().toISOString().split('T')[0];
        let streakData = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"streak": 0, "lastDate": ""}');

        if (streakData.lastDate === today) return;

        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toISOString().split('T')[0];

        if (streakData.lastDate === yesterdayStr) {
            streakData.streak += 1;
        } else {
            streakData.streak = 1;
        }

        streakData.lastDate = today;
        localStorage.setItem(STREAK_KEY, JSON.stringify(streakData));
    }

    function renderDashboard(filterCat = 'all') {
        if (!lessonsData) return;

        const main = document.getElementById('main-content');
        main.innerHTML = '';

        lessonsData.categories.forEach(cat => {
            if (filterCat !== 'all' && cat.id !== filterCat) return;

            const catBlock = document.createElement('div');
            catBlock.className = 'category-block';

            let catTotal = 0, catDone = 0;
            cat.weeks.forEach(w => {
                w.lessons.forEach(l => {
                    catTotal++;
                    if (userProgress[l.id]) catDone++;
                });
            });

            catBlock.innerHTML = `
                <div class="category-header">
                    <h3>${cat.name} (${cat.nameEn})</h3>
                    <span class="category-progress-text">${catDone}/${catTotal} Xong</span>
                </div>
                <div class="weeks-container">
                    ${cat.weeks.map(w => `
                        <div class="week-card">
                            <div class="week-title">
                                <span>Tuần ${w.week}</span>
                                <span>${w.lessons.filter(l => userProgress[l.id]).length}/${w.lessons.length}</span>
                            </div>
                            <div class="lessons-grid">
                                ${w.lessons.map(l => `
                                    <div class="lesson-item ${userProgress[l.id] ? 'completed' : ''}" data-id="${l.id}" data-cat="${cat.id}" data-title="${l.title}">
                                        <div class="custom-checkbox"></div>
                                        <div class="lesson-content">
                                            <div class="lesson-meta">Ngày ${l.day} • ${l.type === 'practice' ? 'Thực chiến' : 'Bài học'}</div>
                                            <div class="lesson-title">${l.title}</div>
                                        </div>
                                        <button class="study-btn">Học</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            main.appendChild(catBlock);
        });

        renderStats();
    }

    function openStudyModal(id, catId, title) {
        currentActiveLessonId = id;
        const modal = document.getElementById('study-modal');
        const body = document.getElementById('modal-body');
        const catHeader = document.getElementById('modal-category');
        const toggleBtn = document.getElementById('modal-toggle-complete');

        catHeader.textContent = catId.toUpperCase();
        document.getElementById('modal-lesson-id').textContent = `MÃ BÀI HỌC: ${id}`;

        const content = sampleContent[catId] || sampleContent.grammar;

        body.innerHTML = `
            <h4>${title}</h4>
            <div class="grammar-point">
                <div class="grammar-title">${title}</div>
                <div class="grammar-meaning">${content.meaning}</div>
                <p style="color: var(--text-muted); font-size: 14px;">${content.explanation}</p>
            </div>
            <h5 style="font-family: var(--font-sans); font-size: 14px; margin-bottom: 8px;">Ví dụ mẫu:</h5>
            ${content.examples.map(ex => `
                <div class="example-box">
                    <div class="jp-sentence">${ex.jp}</div>
                    <div class="vi-sentence">${ex.vi}</div>
                </div>
            `).join('')}
        `;

        toggleBtn.textContent = userProgress[id] ? 'Bỏ đánh dấu' : 'Đánh dấu đã học';
        modal.classList.add('active');
    }

    function setupEventListeners() {
        document.getElementById('main-content').addEventListener('click', (e) => {
            const studyBtn = e.target.closest('.study-btn');
            const item = e.target.closest('.lesson-item');

            if (studyBtn && item) {
                e.stopPropagation();
                openStudyModal(item.getAttribute('data-id'), item.getAttribute('data-cat'), item.getAttribute('data-title'));
                return;
            }

            if (item) {
                const lessonId = item.getAttribute('data-id');
                userProgress[lessonId] = !userProgress[lessonId];
                if (!userProgress[lessonId]) delete userProgress[lessonId];
                item.classList.toggle('completed', !!userProgress[lessonId]);
                saveUserProgress();

                const activeTab = document.querySelector('.tab-btn.active').getAttribute('data-cat');
                renderDashboard(activeTab);
            }
        });

        document.getElementById('category-tabs').addEventListener('click', (e) => {
            if (!e.target.classList.contains('tab-btn')) return;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            renderDashboard(e.target.getAttribute('data-cat'));
        });

        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('study-modal').classList.remove('active');
        });

        document.getElementById('modal-toggle-complete').addEventListener('click', () => {
            if (!currentActiveLessonId) return;
            userProgress[currentActiveLessonId] = !userProgress[currentActiveLessonId];
            if (!userProgress[currentActiveLessonId]) delete userProgress[currentActiveLessonId];
            saveUserProgress();

            const activeTab = document.querySelector('.tab-btn.active').getAttribute('data-cat');
            renderDashboard(activeTab);
            document.getElementById('study-modal').classList.remove('active');
        });
    }
</script>
</body>
</html>
